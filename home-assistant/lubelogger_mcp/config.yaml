name: LubeLogger MCP
version: "0.7.0-a2fe5a9"
slug: lubelogger_mcp
description: Lets Claude log service, fuel and odometer records into LubeLogger
url: https://github.com/edonnel/lubelogger-mcp
arch:
  - amd64
startup: application
boot: auto
watchdog: http://[HOST]:[PORT:3000]/healthz
options:
  lubelogger_url: http://local-lubelogger:8080
  lubelogger_api_key: ""
  homeassistant: true
  oidc: false
  lubelogger_password: false
  lubelogger_key: false
schema:
  lubelogger_url: url
  lubelogger_api_key: password?
  homeassistant: bool?
  public_url: url?
  home_assistant_public_url: url?
  allowed_redirect_hosts: str?
  oidc: bool?
  lubelogger_password: bool?
  lubelogger_key: bool?
  lubelogger_allowed_users: str?
  oidc_issuer: url?
  oidc_client_id: str?
  oidc_client_secret: password?
  oidc_display_name: str?
  oidc_allowed_emails: str?
  oidc_allowed_subjects: str?
  oidc_required_group: str?
  oidc_groups_claim: str?
  oidc_auth_params: str?
