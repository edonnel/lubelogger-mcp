name: LubeLogger MCP
version: "0.5.1-53b6865"
slug: lubelogger_mcp
description: Lets Claude log service, fuel and odometer records into LubeLogger
url: https://github.com/edonnel/lubelogger-mcp
arch:
  - amd64
startup: application
boot: auto
watchdog: http://[HOST]:[PORT:3000]/healthz
options:
  lubelogger_url: http://local-lubelogger:8080
  lubelogger_api_key: ""
  homeassistant: true
schema:
  lubelogger_url: url
  lubelogger_api_key: password
  homeassistant: bool?
  public_url: url?
  home_assistant_public_url: url?
  allowed_redirect_hosts: str?
